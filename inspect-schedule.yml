name: Inspect Keirin Schedule HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect official schedule page
        run: python scripts/inspect_schedule_html.py

      - name: Save inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule_inspection.json
          git diff --cached --quiet || git commit -m "Inspect official schedule HTML"
          git push
