name: Probe Race List POST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run diagnostic
        run: python scripts/probe_race_list_post.py

      - name: Validate diagnostic
        run: |
          test -s data/race_transition_diagnostic.json
          python -m json.tool data/race_transition_diagnostic.json > /dev/null

      - name: Save diagnostic to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race_transition_diagnostic.json
          if git diff --cached --quiet; then
            echo "診断結果に変更はありません"
          else
            git commit -m "Update race transition diagnostic"
            git push
          fi
