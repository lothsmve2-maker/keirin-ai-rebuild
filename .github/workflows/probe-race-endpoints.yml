name: Probe Keirin Race Endpoints

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe endpoints
        run: python scripts/probe_race_endpoints.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race_endpoint_probe.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Probe official keirin race endpoints"
            git push
          fi
