name: Probe Keirin Comment Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run comment source probe
        run: |
          python -u scripts/probe_comment_source.py

      - name: Print diagnostic JSON
        if: always()
        run: |
          echo "===== DIAGNOSTIC JSON START ====="
          if [ -f data/comment_source_diagnostic.json ]; then
            cat data/comment_source_diagnostic.json
          else
            echo "診断JSONが見つかりません"
          fi
          echo "===== DIAGNOSTIC JSON END ====="
