name: Inspect Keirin Race Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect official race sources
        run: python scripts/inspect_race_source.py

      - name: Commit inspection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race_source_inspection.json
          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Inspect official keirin race sources"
            git push
          fi
