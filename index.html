<html lang="ja">
<head>

<title>競輪AI予想</title>
<style>
:root{--navy:#07356d;--navy2:#0b4b8d;--blue:#0878f9;--pale:#eef6ff;--line:#d9e8f8;--ink:#14243a;--muted:#64758b;--green:#0b9a68;--red:#e84250;--shadow:0 3px 12px #0c3c7010}
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px;padding-bottom:86px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}.appbar{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#082d5e,#07549a);color:#fff;padding:14px 16px 13px;box-shadow:0 3px 12px #092c5233}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:900;letter-spacing:.02em}.tagline{font-size:11px;opacity:.84;margin-top:4px}.iconbtn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:12px;padding:8px 10px}.wrap{max-width:760px;margin:0 auto;padding:12px}.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:white;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-weight:800;margin-bottom:10px;box-shadow:var(--shadow)}.datebar small{font-weight:600;color:var(--muted)}.segmented{display:flex;gap:5px;background:#e3eefb;padding:4px;border-radius:12px;margin:0 0 12px}.segmented button{flex:1;border:0;border-radius:9px;background:transparent;color:#49627f;font-weight:800;padding:9px 4px;font-size:12px}.segmented button.active{background:var(--blue);color:#fff;box-shadow:0 2px 7px #0878f933}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}.sectionhead h2{font-size:16px;margin:0;font-weight:900}.muted{color:var(--muted);font-size:11px}.venue-list{display:grid;gap:8px}.venue{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:9px;box-shadow:var(--shadow);color:inherit}.trackthumb{width:60px;height:48px;flex:none;border-radius:9px;background:linear-gradient(135deg,#bde9f7,#e6f5ff 40%,#4d9f9a 41%,#2c8277 54%,#d9f0d5 55%);display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 1px 3px #164f6c}.venuebody{min-width:0;flex:1}.venuetop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:900}.venuecode{font-size:10px;background:#e9f2fc;color:#345778;border-radius:5px;padding:3px 5px}.venuebottom{font-size:11px;color:var(--muted);margin-top:5px}.venuecount{text-align:center;min-width:40px}.venuecount strong{display:block;font-size:19px;color:#153e6c}.venuecount small{font-size:10px;color:var(--muted)}.chevron{font-size:20px;color:#8ba2bc}.pill{display:inline-block;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:900;background:#edf4ff;color:#255a9a}.pill.hot{background:#fff0f0;color:#d73543}.pill.green{background:#e5f8ef;color:#087c54}.pill.gray{background:#f0f2f5;color:#6b7788}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}.racehead{display:flex;align-items:center;gap:10px}.back{border:0;background:#eaf3ff;color:#0c4b8c;border-radius:10px;padding:8px 10px;font-size:18px}.racetitle{font-size:18px;font-weight:900}.raceinfo{font-size:11px;color:var(--muted);margin-top:3px}.star{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px}.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);margin:0 -12px 12px;padding:0 6px}.tabs button{flex:1;border:0;background:none;padding:11px 3px;color:#61758b;font-size:12px;font-weight:800;border-bottom:3px solid transparent}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}.scoreline{display:flex;align-items:center;gap:12px}.grade{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#fff0bd;color:#d39a00;font-size:33px;font-weight:1000;border:4px solid #ffe08a;flex:none}.grade.SS{background:#f0e5ff;color:#7928c8;border-color:#d9bcff}.grade.S{background:#fff0bd;color:#d39a00;border-color:#ffe08a}.grade.A{background:#e0f0ff;color:#1269c8;border-color:#b7dcff}.grade.B{background:#e4f8ee;color:#0b9561;border-color:#b7ebd0}.grade.C{background:#f0f2f5;color:#66758a;border-color:#dfe4eb}.scoretext{font-weight:900;color:var(--green)}.reasonbox{background:#eef6ff;border:1px solid #d3e7ff;border-radius:10px;padding:9px;margin-top:6px;font-size:12px;line-height:1.6}.pickrow{display:flex;align-items:center;gap:8px;border:1px solid #e3edf8;border-radius:10px;padding:7px 8px;margin-top:7px}.picklabel{width:40px;text-align:center;color:white;border-radius:6px;font-weight:900;font-size:11px;padding:6px 2px}.picklabel.main{background:#f04452}.picklabel.sub{background:#0b8fd4}.picklabel.long{background:#72b92b}.number{width:27px;height:27px;display:inline-grid;place-items:center;border-radius:7px;color:#fff;font-weight:1000;font-size:14px;flex:none}.n1{background:#f8f8f8;color:#222;border:1px solid #cfd7df}.n2{background:#242f3b}.n3{background:#ed3348}.n4{background:#1674e8}.n5{background:#f5ce19;color:#222}.n6{background:#2b9b53}.n7{background:#ff9414}.n8{background:#df2993}.n9{background:#7e55cf}.pickname{font-weight:800;flex:1}.pickwhy{font-size:11px;color:var(--muted)}.linechips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.linegroup{display:flex;align-items:center;gap:4px;background:#f8fbff;border:1px solid #e2edf9;border-radius:10px;padding:7px;margin:5px 0}.linegroup small{margin-left:7px;color:var(--muted);font-size:10px}.betrow{display:grid;grid-template-columns:22px 1fr 72px;gap:7px;align-items:center;padding:9px 3px;border-bottom:1px solid #edf2f8}.betrow:last-child{border-bottom:0}.betnums{display:flex;align-items:center;gap:5px}.dash{color:#a6b5c6;font-weight:900}.yen{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}.betfoot{display:flex;justify-content:space-between;align-items:center;background:#f0f7ff;border-radius:10px;padding:11px;margin-top:10px;font-weight:900}.primary{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:12px 14px;font-weight:900;width:100%;margin-top:10px}.secondary{background:#edf5ff;color:#07549a;border:1px solid #d5e7fb;border-radius:10px;padding:9px 12px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.metric span{display:block;font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:22px;margin-top:5px}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 7px;border-bottom:1px solid #e7eff8;text-align:left}th{color:#60758b;background:#f5f9ff}.rider{display:grid;grid-template-columns:27px minmax(68px,1fr) 28px minmax(78px,1.1fr);align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid #edf2f8}.rider:last-child{border-bottom:0}.ridername{font-weight:800}.rider small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.mini-grade{font-weight:1000;text-align:center}.flowtrack{height:160px;border:8px solid #dce7f1;border-radius:90px;position:relative;margin:16px 0 12px;background:#f8fbff}.flowtrack:before{content:"";position:absolute;inset:18px 22px;border:2px dashed #b8cada;border-radius:70px}.riderdot{position:absolute;display:flex;align-items:center;gap:3px;z-index:1;font-weight:900}.riderdot .number{width:24px;height:24px;font-size:12px}.flowlist{display:grid;gap:8px}.flowstep{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5}.stepno{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#e5f1ff;color:#1266b2;font-weight:900;flex:none}.explain{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;border:1px solid #e1ecf8;border-radius:11px;padding:10px;margin:7px 0}.explainicon{height:36px;width:36px;border-radius:10px;background:#e8f3ff;display:grid;place-items:center;font-size:19px}.explain strong{font-size:12px}.explain p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.55}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #dbe7f3;display:flex;justify-content:center;padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px #153c6310}.nav button{flex:1;max-width:150px;border:0;background:transparent;color:#8193a8;font-size:10px;font-weight:800;padding:4px 2px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--blue)}.nav button.active span{transform:translateY(-1px)}.notice{padding:10px 12px;border-radius:10px;background:#fff8e8;border:1px solid #f4dfad;color:#7d5b12;font-size:11px;line-height:1.6;margin:8px 0}.empty{padding:22px 14px;text-align:center;color:var(--muted);line-height:1.7}.settingrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf2f8}.settingrow:last-child{border:0}.settingicon{width:31px;text-align:center;font-size:19px}.settingbody{flex:1}.settingbody strong{display:block}.settingbody small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.toggle{accent-color:var(--blue);width:20px;height:20px}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800}.status{font-size:10px;color:#d17a00;font-weight:800}.hide{display:none!important}.footer-note{text-align:center;color:#8797a9;font-size:10px;padding:15px 0}
@media(min-width:650px){.venue-list{grid-template-columns:1fr 1fr}.wrap{padding:18px}.appbar{padding-left:max(16px,calc((100vw - 720px)/2));padding-right:max(16px,calc((100vw - 720px)/2))}}
</style>
</head>
<body>
<header class="appbar"><div class="brandrow"><div><div class="brand">🏇 競輪AI予想</div><div class="tagline">AI評価・展開・ラインから勝負レースを分析</div></div><button class="iconbtn" id="refreshBtn" aria-label="データ更新">⟳ 更新</button></div></header>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="メインメニュー">
<button data-page="home" class="active"><span>⌂</span>ホーム</button><button data-page="races"><span>⚙</span>レース</button><button data-page="predict"><span>✎</span>予想</button><button data-page="results"><span>▥</span>結果</button><button data-page="settings"><span>⚙</span>設定</button>
</nav>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date();const fmtDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
let state={page:'home',tab:'today',raceTab:'ai',venue:null,race:null,data:null,loaded:false,err:null,settings:{notify:true,autoOdds:true}};
const demoVenues=[{name:'前橋',code:'22',races:9,start:'10:45',type:'A級・GIII'},{name:'大宮',code:'25',races:12,start:'13:10',type:'S級・GIII'},{name:'平塚',code:'35',races:12,start:'13:45',type:'S級特選'},{name:'静岡',code:'38',races:11,start:'13:20',type:'S級・GIII'},{name:'大垣',code:'44',races:9,start:'12:10',type:'A級特選'},{name:'四日市',code:'48',races:12,start:'15:20',type:'S級・GIII'},{name:'高知',code:'74',races:7,start:'11:50',type:'A級特選'}];
function arr(v){return Array.isArray(v)?v:[]}
function getVenues(){let d=state.data;if(!d)return [];let v=d.venues||d開催||d.meetings||d.races_by_venue||[];if(Array.isArray(v))return v;if(v&&typeof v==='object')return Object.entries(v).map(([name,x])=>typeof x==='object'?{name,...x}:{name,races:x});return []}
function normalizeVenue(v){let races=arr(v.races||v.race_list||v.events||v.raceList);return {raw:v,name:v.name||v.venue||v.venue_name||v.track||v場名||'開催場',code:v.code||v.venue_code||v.場コード||'',racesCount:Number(v.race_count||v.races_count||v.raceCount||v.count)||races.length||0,races,start:v.start||v.first_start||'',type:v.type||v.grade||v.class||''}}
function allRaces(){return getVenues().flatMap(v=>{let n=normalizeVenue(v);return n.races.map((r,i)=>({...r,_venue:n.name,_venueCode:n.code,_raceNo:r.race_no||r.raceNo||r.number||i+1}))})}
function currentDate(){return state.data?.date||state.data?.target_date||state.data?.開催日||fmtDate(today)}
function dataState(){if(!state.data)return `<div class="notice">${state.err?'データを読み込めませんでした。':'データを確認中です。'} ${state.err?'公開先の data/today.json と取得状況を確認してください。':'しばらくお待ちください。'}</div>`;let st=state.data.status||'unknown';if(st!=='ok'&&st!=='success')return `<div class="notice">データ状態：${esc(st)}。一部の情報が未取得の可能性があります。買い目・オッズ・結果の確定状況を確認してください。</div>`;return ''}
async function loadData(){state.err=null;try{let r=await fetch('../data/today.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json();if(!d||typeof d!=='object')throw new Error('JSON形式が不正です');state.data=d;state.loaded=true;localStorage.setItem('keirin_ai_last_data',JSON.stringify(d));}catch(e){state.err=e.message;try{let cached=localStorage.getItem('keirin_ai_last_data');if(cached)state.data=JSON.parse(cached)}catch(_){}}render()}
function venueList(){let list=getVenues().map(normalizeVenue);if(!list.length)return `<div class="empty">開催データが見つかりません。<br><small>data/today.json の会場データ形式を確認してください。</small></div>`;return `<div class="venue-list">${list.map((v,i)=>`<button class="venue" data-venue="${i}"><div class="trackthumb">🏟</div><div class="venuebody"><div class="venuetop">${esc(v.name)} ${v.code?`<span class="venuecode">${esc(v.code)}</span>`:''}</div><div class="venuebottom">${esc(v.type||'開催情報')} ${v.start?'・'+esc(v.start)+'〜':''}</div></div><div class="venuecount"><strong>${v.racesCount||'—'}R</strong><small>開催数</small></div><span class="chevron">›</span></button>`).join('')}</div>`}
function homePage(){return `<div class="datebar"><span>${esc(currentDate())}</span><small>開催情報</small></div><div class="segmented"><button class="${state.tab==='today'?'active':''}" data-hometab="today">今日の開催</button><button class="${state.tab==='fav'?'active':''}" data-hometab="fav">お気に入り</button><button class="${state.tab==='past'?'active':''}" data-hometab="past">過去の結果</button></div>${dataState()}<div class="sectionhead"><h2>開催中の競輪場</h2><span class="muted">${getVenues().length||0}会場</span></div>${state.tab==='fav'?'<div class="empty">お気に入りの競輪場は、設定から登録できます。</div>':state.tab==='past'?'<div class="empty">過去の結果は「結果」画面で確認できます。</div>':venueList()}<div class="footer-note">予想・オッズ・結果は取得できたデータのみ表示します。</div>`}
function gradeOf(r){let x=r.ai_grade||r.grade||r.rating||r.ai_rating||r.confidence_grade||'—';x=String(x).toUpperCase();return ['SS','S','A','B','C'].includes(x)?x:'—'}
function raceLabel(r){return `${r._venue||r.venue||''} ${r._raceNo||r.race_no||r.number||''}R`}
function raceListPage(){let races=allRaces();if(!races.length)return `${dataState()}<div class="empty">レース一覧データが見つかりません。<br>today.jsonのレース構造に合わせて接続を調整します。</div>`;return `${dataState()}<div class="sectionhead"><h2>全レース</h2><span class="muted">${races.length}レース</span></div>${races.map((r,i)=>`<button class="venue" data-race-index="${i}" style="margin-bottom:7px"><div class="venuebody"><div class="venuetop">${esc(raceLabel(r))} <span class="pill ${gradeOf(r)==='SS'||gradeOf(r)==='S'?'hot':''}">${esc(gradeOf(r))}評価</span></div><div class="venuebottom">${esc(r.race_name||r.title||r.class||'出走表・AI予想')}</div></div><span class="chevron">›</span></button>`).join('')}`}
function getRace(){if(state.race)return state.race;return allRaces()[0]||null}
function riders(r){return arr(r?.entries||r?.riders||r?.players||r?.出走表||r?.entry_list)}
function riderNo(p,i){return Number(p.number||p.car_no||p.car||p.frame||p車番)||i+1}
function riderName(p){return p.name||p.rider_name||p.player_name||p.選手名||'選手情報未取得'}
function gradeColor(g){return ['SS','S','A','B','C'].includes(g)?g:'C'}
function betList(r){return arr(r?.bets||r?.betting||r?.ai_bets||r?.recommendations||r?.買い目)}
function betNums(b){if(Array.isArray(b))return b.slice(0,3).map(Number);let n=b.numbers||b.bet||b.combo||b.selection||b.ticket||b.組番;if(Array.isArray(n))return n.map(Number);if(typeof n==='string'){let m=n.match(/[1-9]/g);return m?m.slice(0,3).map(Number):[]}return [b.first,b.second,b.third].map(Number).filter(Boolean)}
function betOdds(b){let n=Number(b.odds||b.オッズ);return Number.isFinite(n)&&n>0?n:null}
function betAmount(b){let n=Number(b.amount||b.stake||b.bet_yen||b.金額);return n>0?n:100}
function yen(n){return Number(n||0).toLocaleString('ja-JP')+'円'}
function betHTML(b,i){let ns=betNums(b);return `<div class="betrow"><strong>${i+1}</strong><div class="betnums">${ns.map((n,j)=>`${j?'<span class="dash">-</span>':''}<span class="number n${n}">${n}</span>`).join('')}</div><div class="yen">${betOdds(b)?betOdds(b).toFixed(1)+'倍':'—'}<small style="display:block;color:#6b7d91;font-size:10px">${yen(betAmount(b))}</small></div></div>`}
function racePage(){let r=getRace();if(!r)return `${dataState()}<div class="empty">レースデータがありません。</div>`;let grade=gradeOf(r);let es=riders(r);let bets=betList(r);let name=r._venue||r.venue||r.venue_name||'開催場';let rn=r._raceNo||r.race_no||r.race_number||1;let confidence=Number(r.confidence||r.ai_confidence||r.ai_score);let reasons=r.reason||r.ai_reason||r.prediction_reason||'取得済みの選手データ・ライン・コメントをもとに分析します。情報が不足する場合は評価を確定しません。';let main=arr(r.picks||r.top_picks||r.ai_picks);return `<div class="card"><div class="racehead"><button class="back" data-page="races">‹</button><div><div class="racetitle">${esc(name)} ${esc(rn)}R</div><div class="raceinfo">${esc(r.grade||r.class||'出走表')} ・ ${esc(r.start_time||r.start||'発走時刻未取得')}</div></div><button class="star" data-favorite="${esc(name)}">☆</button></div><div class="tabs">${[['ai','AI予想'],['entries','出走表'],['line','展開・ライン'],['data','データ']].map(([k,t])=>`<button data-racetab="${k}" class="${state.raceTab===k?'active':''}">${t}</button>`).join('')}</div>${state.raceTab==='ai'?`<div class="sectionhead"><h2>AI総合評価</h2><span class="status">${grade==='—'?'評価データ未取得':'評価 '+grade}</span></div><div class="scoreline"><div class="grade ${gradeColor(grade)}">${esc(grade)}</div><div><div class="scoretext">${confidence?`AI注目度 ${confidence}/100`:'AI注目度 —'}</div><div class="reasonbox">${esc(reasons)}</div></div></div>${main.length?main.slice(0,3).map((p,i)=>`<div class="pickrow"><span class="picklabel ${['main','sub','long'][i]}">${['本命','対抗','穴'][i]}</span><span class="number n${riderNo(p,i)}">${riderNo(p,i)}</span><div class="pickname">${esc(riderName(p))}<div class="pickwhy">${esc(p.reason||p.comment||'評価理由の詳細を取得中')}</div></div></div>`).join(''):`<div class="notice">本命・対抗・穴は、データ内に予想結果がある場合に表示します。未生成の予想を実績のように表示しません。</div>`}<div class="sectionhead"><h2>ライン構成</h2><span class="muted">取得データに基づく</span></div>${lineHTML(r)}<div class="sectionhead"><h2>買い目（3連単・最大10点）</h2><span class="pill">各100円想定</span></div>${bets.length?bets.slice(0,10).map(betHTML).join(''):`<div class="empty">買い目データはまだありません。<br>予想生成後にここへ表示します。</div>`}<div class="betfoot"><span>合計 ${Math.min(10,bets.length)}点</span><strong>${yen(bets.slice(0,10).reduce((s,b)=>s+betAmount(b),0))}</strong></div>`:state.raceTab==='entries'?entriesHTML(es):state.raceTab==='line'?`<div class="sectionhead"><h2>レース展開（予測）</h2></div>${lineHTML(r)}${animationHTML(r)}`:`<div class="sectionhead"><h2>レースデータ</h2></div><div class="grid2"><div class="metric"><span>オッズ取得状況</span><strong>${r.odds_updated_at?'取得済み':'未確認'}</strong></div><div class="metric"><span>結果確定</span><strong>${r.result_finished===true?'確定':'未確定'}</strong></div></div><div class="notice">発走前予想・最終オッズ・確定結果は別々に保存し、後から過去の予想を書き換えない設計です。</div>`}</div>`}
function entriesHTML(es){if(!es.length)return '<div class="empty">出走表データがありません。</div>';return `<div class="sectionhead"><h2>全選手のAI評価</h2><span class="muted">${es.length}名</span></div>${es.map((p,i)=>{let no=riderNo(p,i),g=String(p.ai_grade||p.rating||p.ai_rating||'—').toUpperCase();return `<div class="rider"><span class="number n${no}">${no}</span><div class="ridername">${esc(riderName(p))}<small>${esc(p.age?`${p.age}歳`:'')}${p.prefecture?' ・'+esc(p.prefecture):''}</small></div><div class="mini-grade">${esc(g)}</div><div class="muted">${esc(p.comment||p.rider_comment||'コメント未取得')}</div></div>`}).join('')}`}
function lineHTML(r){let lines=arr(r?.lines||r?.lineup||r?.line_groups||r?.ライン);if(!lines.length)return `<div class="empty">ライン情報が未取得です。<br>出走表の並びデータを取得できた場合に表示します。</div>`;return lines.map((line,i)=>{let nums=Array.isArray(line)?line:arr(line.riders||line.members||line.cars||line.numbers);return `<div class="linegroup"><div class="linechips">${nums.map((x,j)=>{let n=typeof x==='object'?riderNo(x,j):Number(x);return `<span class="number n${n}">${n}</span>`}).join('<span class="dash">›</span>')}</div><small>${esc(line.name||line.label||`ライン${i+1}`)}</small></div>`}).join('')}
function animationHTML(r){let es=riders(r);let dots=es.slice(0,9).map((p,i)=>{let positions=[[15,22],[35,22],[55,22],[68,48],[49,68],[29,68],[10,50],[72,26],[58,52]][i];return `<div class="riderdot" style="left:${positions[0]}%;top:${positions[1]}%"><span class="number n${riderNo(p,i)}">${riderNo(p,i)}</span></div>`}).join('');return `<div class="flowtrack">${dots||'<div class="empty">選手データ待ち</div>'}</div><div class="flowlist"><div class="flowstep"><span class="stepno">1</span><div><strong>序盤の位置取り</strong><br>出走表・コメント・ライン情報から想定します。データ不足時は確定表示しません。</div></div><div class="flowstep"><span class="stepno">2</span><div><strong>仕掛け・捲り・差し</strong><br>脚質やライン構成をもとにした予測シミュレーションです。</div></div><div class="flowstep"><span class="stepno">3</span><div><strong>ゴール前の想定</strong><br>実際のレース映像ではなく、AIの想定展開を示します。</div></div></div><button class="primary" id="playAnimation">▶ 展開シミュレーションを再生</button>`}
function resultsPage(){let perf=state.data?.performance||state.data?.performance_summary||state.data?.stats||{};let races=allRaces();let confirmed=races.filter(r=>r.result_finished===true||r.result?.finished===true);let invest=Number(perf.investment||perf.total_investment||0),payout=Number(perf.payout||perf.total_payout||0),profit=Number(perf.profit??(payout-invest));let hit=Number(perf.hit_rate||perf.hit_rate_pct||0),rec=invest?payout/invest*100:Number(perf.recovery_rate||0);return `<div class="sectionhead"><h2>結果・収支</h2><span class="muted">実績データのみ集計</span></div><div class="segmented">${['レース別','会場別','1日合計','週間','月間','年間'].map((t,i)=>`<button data-period="${t}" class="${(state.period||'1日合計')===t?'active':''}">${t}</button>`).join('')}</div>${dataState()}<div class="datebar"><span>${esc(currentDate())}</span><small>${confirmed.length}レース結果確認済み</small></div><div class="grid2"><div class="metric"><span>的中率</span><strong>${hit?hit.toFixed(1)+'%':'—'}</strong></div><div class="metric"><span>回収率</span><strong class="${rec>=100?'positive':rec?'negative':''}">${rec?rec.toFixed(1)+'%':'—'}</strong></div><div class="metric"><span>総投資額</span><strong>${invest?yen(invest):'—'}</strong></div><div class="metric"><span>総払戻金</span><strong>${payout?yen(payout):'—'}</strong></div></div><div class="card" style="margin-top:10px"><div class="sectionhead"><h2>総収支</h2></div><div style="font-size:28px;font-weight:1000" class="${profit>0?'positive':profit<0?'negative':''}">${invest||payout?(profit>0?'+':'')+yen(profit):'—'}</div><div class="notice">過去データが未取得、または確定レースがない場合は収支を推測で埋めません。</div></div><div class="card"><div class="sectionhead"><h2>自信度別の回収分析</h2></div><div class="tablewrap"><table><thead><tr><th>評価</th><th>購入R</th><th>的中率</th><th>回収率</th><th>収支</th></tr></thead><tbody>${['SS','S','A','B','C'].map(g=>`<tr><td><strong>${g}</strong></td><td>—</td><td>—</td><td>—</td><td>未集計</td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:8px">集計データが十分に蓄積されるまで、評価別の優劣は判断しません。</div></div>`}
function predictPage(){let r=getRace();return `<div class="sectionhead"><h2>予想・買い目</h2></div>${r?racePage():`<div class="empty">レースデータを読み込むと、AI予想と買い目が表示されます。</div>`}`}
function settingsPage(){return `<div class="sectionhead"><h2>設定</h2></div><div class="card">${[['🔔','通知設定','レース締切・結果の通知','notify'],['⭐','お気に入り競輪場','よく見る開催場を登録'],['🤖','AIの予想スタイル','バランス重視'],['🎟','買い目の設定','最大10点・1点100円想定'],['⟳','データ更新','JSONデータを読み込み直す'],['❔','使い方・ヘルプ','予想・オッズ・収支の見方']].map((x,i)=>`<div class="settingrow"><div class="settingicon">${x[0]}</div><div class="settingbody"><strong>${x[1]}</strong><small>${x[2]}</small></div>${x[3]?`<input class="toggle" type="checkbox" data-setting="${x[3]}" ${state.settings[x[3]]?'checked':''}>`:`<span class="chevron">›</span>`}</div>`).join('')}</div><div class="notice">自動更新の実行間隔はデータ取得側のスケジュールに依存します。この画面の更新ボタンは、公開済みJSONを再読み込みします。</div><div class="card"><strong>データの状態</strong><div class="venuebottom" style="margin-top:8px">${state.data?'読み込み済み':'未読み込み'} ・ ${esc(state.data?.updated_at||state.data?.generated_at||'更新時刻未取得')}</div><button class="secondary" id="reloadData" style="margin-top:10px">データを再読み込み</button></div><div class="footer-note">競輪AI予想 ・ 再構築版</div>`}
function render(){let app=$('#app');if(state.page==='home')app.innerHTML=homePage();else if(state.page==='races')app.innerHTML=raceListPage();else if(state.page==='predict')app.innerHTML=predictPage();else if(state.page==='results')app.innerHTML=resultsPage();else app.innerHTML=settingsPage();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
function selectRace(r){state.race=r;state.venue=r?._venue||r?.venue||null;state.raceTab='ai';state.page='predict';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.dataset.hometab){state.tab=b.dataset.hometab;render();return}if(b.dataset.racetab){state.raceTab=b.dataset.racetab;render();return}if(b.dataset.venue!==undefined){let v=getVenues().map(normalizeVenue)[Number(b.dataset.venue)];if(v?.races.length)selectRace({...v.races[0],_venue:v.name,_venueCode:v.code,_raceNo:v.races[0].race_no||1});else{state.page='races';render()}return}if(b.dataset.raceIndex!==undefined){let r=allRaces()[Number(b.dataset.raceIndex)];if(r)selectRace(r);return}if(b.dataset.favorite){let f=JSON.parse(localStorage.getItem('keirin_ai_favs')||'[]');let n=b.dataset.favorite;if(f.includes(n))f=f.filter(x=>x!==n);else f.push(n);localStorage.setItem('keirin_ai_favs',JSON.stringify(f));b.textContent=f.includes(n)?'★':'☆';return}if(b.id==='refreshBtn'||b.id==='reloadData'){loadData();return}if(b.id==='playAnimation'){b.textContent='⟳ シミュレーション再生中';let dots=document.querySelectorAll('.riderdot');dots.forEach((d,i)=>{d.animate([{transform:'translate(0,0)'},{transform:`translate(${(i%3-1)*14}px,${(i%2?1:-1)*10}px)`},{transform:'translate(0,0)'}],{duration:900,delay:i*90,iterations:2})});setTimeout(()=>{if(document.body.contains(b))b.textContent='▶ 展開シミュレーションを再生'},2200);return}if(b.dataset.period){state.period=b.dataset.period;render();return}});
document.addEventListener('change',e=>{let k=e.target.dataset.setting;if(k){state.settings[k]=e.target.checked;localStorage.setItem('keirin_ai_settings',JSON.stringify(state.settings))}});
try{state.settings={...state.settings,...JSON.parse(localStorage.getItem('keirin_ai_settings')||'{}')}}catch(_){}
loadData();
})();
</script>
</body>
</html>
